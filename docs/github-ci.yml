# Copy to .github/workflows/ci.yml after granting the GitHub token `workflow` scope.
# Current machine OAuth cannot create Actions workflow files.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx tsc -p apps/api/tsconfig.build.json --noEmit
      - run: npx tsc -p apps/web/tsconfig.json --noEmit
      - run: npm test --workspace=@syntrix/api -- --watchman=false
        env:
          NODE_ENV: test
