services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-syntrix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syntrix_dev_pw}
      POSTGRES_DB: ${POSTGRES_DB:-syntrix}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U syntrix"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://syntrix:syntrix_dev_pw@postgres:5432/syntrix?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /data/uploads
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://201.18.196.182:8080}
      API_PORT: "3001"
    volumes:
      - uploads:/data/uploads
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://syntrix:syntrix_dev_pw@postgres:5432/syntrix?schema=public
      REDIS_URL: redis://redis:6379
      STORAGE_DRIVER: local
      LOCAL_STORAGE_PATH: /data/uploads
      PROCESS_ROLE: worker
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    command: node dist/worker.js
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
volumes:
  pgdata: {}
  redisdata: {}
  uploads: {}
