[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "syntrixapi"
version = "1.0.0"
description = "Official Python SDK for SyntrixAPI — pay-ins, payouts (Payout Shield signed) and refunds"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["payments", "payin", "payout", "syntrixapi"]

[tool.setuptools.packages.find]
include = ["syntrixapi*"]
