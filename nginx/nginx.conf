server {
  listen 80;
  server_name syntrixapi.in www.syntrixapi.in _;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl;
  http2 on;
  server_name syntrixapi.in www.syntrixapi.in _;
  client_max_body_size 12m;

  ssl_certificate     /etc/letsencrypt/live/syntrixapi.in/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/syntrixapi.in/privkey.pem;
  ssl_protocols       TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;

  location /api/ {
    proxy_pass http://api:3001/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Cookie $http_cookie;
    proxy_pass_header Set-Cookie;
    proxy_connect_timeout 10s;
    proxy_read_timeout 60s;
  }

  location /health {
    proxy_pass http://api:3001/health;
  }

  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;
  }
}
